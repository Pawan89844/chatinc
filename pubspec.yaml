name: chatinc
description: "A Chat App"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_contacts: ^1.1.8
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

fonts:
  family: Mona
  fonts:
    - asset: fonts/mona/Mona-Sans.ttf
    - asset: fonts/mona/Mona-Sans-Bold.ttf
